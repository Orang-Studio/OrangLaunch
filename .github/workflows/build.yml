name: Build Windows

on:
  push:
    branches: [Windows]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'wix/**'
      - 'version.txt'
      - '.github/workflows/build.yml'
      - '!**/*.md'
      - '!**/LICENSE'
      - '!**/SECURITY.md'
      - '!**/README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release view "Win-$v" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            "should_publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release Win-$v already exists - building only, no publish"
          } else {
            "should_publish=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release Win-$v does not exist - will publish"
          }
          exit 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish x86
        shell: pwsh
        run: dotnet publish src/OrangLauncher -c Release -p:Platform=x86 -r win-x86 --self-contained true -o publish/x86

      - name: Publish ARM64
        shell: pwsh
        run: dotnet publish src/OrangLauncher -c Release -p:Platform=ARM64 -r win-arm64 --self-contained true -o publish/arm64

      - name: Package zips
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path publish/x86/*   -DestinationPath "launcher_x86_win_$v.zip"
          Compress-Archive -Path publish/arm64/* -DestinationPath "launcher_arm64_win_$v.zip"

      - name: Build MSI (x86)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force wix/build | Out-Null
          Copy-Item publish/x86/* wix/build/ -Recurse
          dotnet build wix/installer/OrangLauncher.wixproj -c Release -p:ProductVersion=$v
          $msi = Get-ChildItem wix/installer/bin -Recurse -Filter *.msi | Select-Object -First 1
          Copy-Item $msi.FullName "OrangLauncher-Windows.msi"

      - name: Create GitHub release
        if: steps.check.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "Win-$v" `
            --repo "${{ github.repository }}" `
            --title "OrangLauncher $v Windows" `
            --generate-notes `
            "launcher_x86_win_$v.zip" `
            "launcher_arm64_win_$v.zip" `
            "OrangLauncher-Windows.msi"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: oranglauncher-windows-${{ steps.version.outputs.version }}
          path: |
            launcher_*_win_*.zip
            OrangLauncher-Windows.msi
          retention-days: 7