name: Source

on:
  workflow_run:
    workflows: ["Binary"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish-aur-src:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          pacman -Sy --noconfirm git openssh sudo base-devel curl perl
          git config --global --add safe.directory '*'
          git config --global --add safe.directory /github/workspace

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^CURRENT_VERSION' launcher.py | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check AUR version
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          AUR_PKGBUILD=$(curl -s "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=oranglauncher")
          AUR_VERSION=$(echo "$AUR_PKGBUILD" | grep '^pkgver=' | sed 's/pkgver=//')
          echo "aur_version=$AUR_VERSION" >> $GITHUB_OUTPUT
          if [ "$VERSION" != "$AUR_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "New version $VERSION (AUR is on $AUR_VERSION) - will publish"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION already on AUR - skipping"
          fi

      - name: Push version tag
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${REPO}/git/ref/heads/main" \
            | grep '"sha"' | head -1 | sed 's/.*"sha": "\([^"]*\)".*/\1/')
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/git/refs" \
            -d "{\"ref\":\"refs/tags/${VERSION}\",\"sha\":\"${SHA}\"}" || true

      - name: Compute source tarball sha256
        if: steps.check.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://github.com/${REPO}/archive/refs/tags/${VERSION}.tar.gz"
          curl -fsSL "$URL" -o source.tar.gz
          echo "SHA256=$(sha256sum source.tar.gz | awk '{print $1}')" >> $GITHUB_ENV

      - name: Set up AUR SSH key
        if: steps.check.outputs.should_publish == 'true'
        env:
          AUR_SRC_SSH_KEY: ${{ secrets.AUR_SRC_SSH_KEY }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,ecdsa,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true

          try_key() {
            local label="$1"
            local raw="$2"
            if [ -z "$raw" ]; then
              echo "Skipping ${label}: secret is empty"
              return 1
            fi
            if printf '%s' "$raw" | grep -q "BEGIN .*PRIVATE KEY"; then
              printf '%s\n' "$raw" > ~/.ssh/aur
            else
              if ! printf '%s' "$raw" | tr -d '[:space:]' | base64 -d > ~/.ssh/aur 2>/dev/null; then
                echo "Skipping ${label}: failed to base64-decode secret"
                return 1
              fi
              printf '\n' >> ~/.ssh/aur
            fi
            chmod 600 ~/.ssh/aur
            if ! ssh-keygen -y -f ~/.ssh/aur >/dev/null 2>&1; then
              echo "Skipping ${label}: not a valid SSH private key"
              return 1
            fi
            if ssh -i ~/.ssh/aur -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new aur@aur.archlinux.org help >/dev/null 2>&1; then
              echo "Authenticated to AUR using ${label}"
              return 0
            fi
            echo "Key ${label} was rejected by aur.archlinux.org (Permission denied)"
            return 1
          }

          if ! try_key "AUR_SRC_SSH_KEY" "$AUR_SRC_SSH_KEY" && ! try_key "AUR_SSH_KEY" "$AUR_SSH_KEY"; then
            echo "::error::Neither AUR_SRC_SSH_KEY nor AUR_SSH_KEY could authenticate to aur.archlinux.org. Update the secret with a private key whose public key is registered on the AUR maintainer account."
            exit 1
          fi

          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n  User aur\n' >> ~/.ssh/config

      - name: Clone AUR repo
        if: steps.check.outputs.should_publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: git clone ssh://aur@aur.archlinux.org/oranglauncher.git /tmp/aur-src

      - name: Update PKGBUILD
        if: steps.check.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKGBUILD=/tmp/aur-src/PKGBUILD

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          sed -i "s/^sha256sums=('[^']*'/sha256sums=('${SHA256}'/" "$PKGBUILD"

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.should_publish == 'true'
        run: |
          cd /tmp/aur-src
          useradd -m builder
          chown -R builder:builder .
          git config --global --add safe.directory /tmp/aur-src
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      - name: Push to AUR
        if: steps.check.outputs.should_publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd /tmp/aur-src
          git config user.name "adasjusk"
          git config user.email "adasjusk2011@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}"
          git push origin master